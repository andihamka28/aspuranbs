<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Bank Santri</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }

:root {
  --bg: #f5f7fb; --bg-alt: #ffffff; --bg-elevated: #ffffff;
  --text: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
  --primary: #10b981; --danger: #ef4444;
}
[data-theme="dark"] {
  --bg: #0a0f1a; --bg-alt: #111827; --bg-elevated: #1a2234;
  --text: #f1f5f9; --text-muted: #94a3b8; --border: #1e293b;
}

body {
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .3s, color .3s;
  font-size: 14px; line-height: 1.6;
}

/* LOADING */
#loadingOverlay {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 99999; gap: 20px;
}
#loadingOverlay.hide { display: none; }
.loading-spinner {
  width: 50px; height: 50px; border: 4px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin .8s linear infinite;
}
.loading-text { font-size: 14px; color: var(--text-muted); font-weight: 600; }
@keyframes spin { to { transform: rotate(360deg); } }

/* LOGIN */
.login-screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  z-index: 5000; padding: 20px; overflow: hidden; background: var(--bg);
}
.login-screen::before {
  content: ''; position: absolute; top: -20%; left: -10%;
  width: 500px; height: 500px; border-radius: 50%;
  background: radial-gradient(circle, rgba(16,185,129,.25), transparent 60%);
  animation: float1 18s ease-in-out infinite; pointer-events: none;
}
.login-screen::after {
  content: ''; position: absolute; bottom: -20%; right: -10%;
  width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(59,130,246,.15), transparent 60%);
  animation: float2 22s ease-in-out infinite; pointer-events: none;
}
@keyframes float1 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(60px, 60px) scale(1.15); }
}
@keyframes float2 {
  0%,100% { transform: translate(0,0) scale(1); }
  50% { transform: translate(-60px, -60px) scale(1.1); }
}

.login-card {
  width: 100%; max-width: 420px; background: var(--bg-elevated);
  border-radius: 24px; padding: 40px 36px;
  box-shadow: 0 20px 60px rgba(15,23,42,.15);
  border: 1px solid var(--border); position: relative; z-index: 1;
  animation: fadeSlideIn .7s cubic-bezier(.34,1.56,.64,1);
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(40px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.login-header-icon {
  width: 76px; height: 76px; border-radius: 22px;
  background: linear-gradient(135deg, #10b981, #059669);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; margin: 0 auto 24px;
  box-shadow: 0 12px 32px rgba(16,185,129,.4);
  animation: pulseGlow 3s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 12px 32px rgba(16,185,129,.4); }
  50% { box-shadow: 0 12px 42px rgba(16,185,129,.65); }
}
.login-card h1 {
  font-size: 26px; font-weight: 800; text-align: center;
  letter-spacing: -.8px; margin-bottom: 8px;
}
.login-card .subtitle {
  text-align: center; color: var(--text-muted);
  font-size: 14px; margin-bottom: 32px;
}
.login-form { display: flex; flex-direction: column; gap: 18px; }
.input-group { display: flex; flex-direction: column; gap: 7px; }
.input-group label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
.input-wrap { position: relative; }
.input-wrap .input-icon {
  position: absolute; left: 15px; top: 50%;
  transform: translateY(-50%); font-size: 16px;
  opacity: .6; pointer-events: none;
}
.input-wrap input {
  width: 100%; padding: 14px 46px 14px 46px;
  border-radius: 12px; border: 1.5px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px;
  font-family: inherit; outline: none; transition: all .2s;
}
.input-wrap input:focus {
  border-color: var(--primary); background: var(--bg-alt);
  box-shadow: 0 0 0 4px rgba(16,185,129,.12);
}
.input-wrap input.error { border-color: var(--danger); animation: shake .4s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
}
.toggle-password {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 16px;
  opacity: .5; padding: 4px;
}
.toggle-password:hover { opacity: 1; }
.btn-login {
  width: 100%; padding: 15px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #10b981, #059669);
  color: white; font-size: 14.5px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  box-shadow: 0 10px 30px rgba(16,185,129,.35);
  transition: all .25s; display: flex; align-items: center;
  justify-content: center; gap: 10px; margin-top: 6px;
}
.btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(16,185,129,.45); }
.btn-login:disabled { opacity: .7; cursor: not-allowed; }
.spinner {
  width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.3);
  border-top-color: white; border-radius: 50%;
  animation: spin .7s linear infinite;
}
.login-alert {
  padding: 12px 14px; border-radius: 10px; font-size: 13px;
  font-weight: 500; display: none; align-items: center; gap: 10px;
}
.login-alert.show { display: flex; }
.login-alert.error { background: rgba(239,68,68,.1); color: var(--danger); border: 1px solid rgba(239,68,68,.2); }
.login-alert.success { background: rgba(16,185,129,.1); color: var(--primary); border: 1px solid rgba(16,185,129,.2); }
.login-footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-muted); }
.theme-toggle-login {
  position: absolute; top: 20px; right: 20px; width: 42px; height: 42px;
  border-radius: 12px; background: var(--bg-alt); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; cursor: pointer; z-index: 10; transition: all .2s;
}
.theme-toggle-login:hover { transform: rotate(20deg); border-color: var(--primary); }
.checkbox-label {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--text-muted); cursor: pointer;
}
.checkbox-label input {
  width: 16px; height: 16px;
  accent-color: var(--primary);
}
@media (max-width: 600px) {
  .login-card { padding: 32px 24px; }
  .login-card h1 { font-size: 22px; }
  .login-header-icon { width: 64px; height: 64px; font-size: 32px; }
}
</style>
</head>
<body>

<div id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Menghubungkan ke Firebase...</div>
</div>

<div class="login-screen">
  <button class="theme-toggle-login" onclick="toggleTheme()" id="themeIcon">🌙</button>
  
  <div class="login-card">
    <div class="login-header-icon">🕌</div>
    <h1>Bank Santri</h1>
    <p class="subtitle">Masuk untuk melanjutkan</p>
    
    <form class="login-form" id="loginForm" onsubmit="handleLogin(event)">
      <div class="login-alert error" id="loginAlert"></div>
      
      <div class="input-group">
        <label>Email</label>
        <div class="input-wrap">
          <span class="input-icon">📧</span>
          <input type="email" id="loginEmail" placeholder="admin@banksantri.com" autocomplete="email" required>
        </div>
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" id="loginPassword" placeholder="Masukkan password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" onclick="togglePassword()" id="togglePassBtn">👁️</button>
        </div>
      </div>
      
      <label class="checkbox-label">
        <input type="checkbox" id="loginRemember" checked>
        <span>Ingat saya di perangkat ini</span>
      </label>
      
      <button type="submit" class="btn-login" id="btnLogin">
        <span id="btnLoginText">🔓 Masuk</span>
      </button>
    </form>
    
    <div class="login-footer">
      🔥 Terhubung ke Firebase · Asrama Putra
    </div>
  </div>
</div>

<script>
/* ============================================================
   🔥 FIREBASE CONFIG
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCyHMJOBZTaEXJCmZGneSblpi3GSu9mYUE",
  authDomain: "asrama-putra-850d5.firebaseapp.com",
  projectId: "asrama-putra-850d5",
  storageBucket: "asrama-putra-850d5.firebasestorage.app",
  messagingSenderId: "904746451509",
  appId: "1:904746451509:web:1fd0fcb9db58667953e77c"
};

let auth = null;
try {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  console.log('✅ Firebase initialized');
} catch (err) {
  console.error('❌ Firebase error:', err);
  alert('Gagal inisialisasi Firebase: ' + err.message);
}

/* ============================================================
   🔐 AUTH CHECK — Kalau sudah login, redirect ke index.html
============================================================ */
if (auth) {
  auth.onAuthStateChanged((user) => {
    hideLoading();
    if (user) {
      console.log('Sudah login:', user.email);
      window.location.href = 'index.html';
    }
  });
} else {
  hideLoading();
}

function hideLoading() {
  const el = document.getElementById('loadingOverlay');
  if (el) el.classList.add('hide');
}

/* ============================================================
   🔓 LOGIN HANDLER
============================================================ */
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('loginRemember').checked;
  const btn = document.getElementById('btnLogin');
  const btnText = document.getElementById('btnLoginText');
  const alertEl = document.getElementById('loginAlert');
  const pwdInput = document.getElementById('loginPassword');
  
  alertEl.classList.remove('show');
  pwdInput.classList.remove('error');
  
  if (!email || !password) {
    showLoginAlert('Email dan password wajib diisi!', 'error');
    return;
  }
  
  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div> Memverifikasi...';
  
  try {
    const persistence = remember 
      ? firebase.auth.Auth.Persistence.LOCAL 
      : firebase.auth.Auth.Persistence.SESSION;
    await auth.setPersistence(persistence);
    await auth.signInWithEmailAndPassword(email, password);
    showLoginAlert('Login berhasil! Mengalihkan...', 'success');
    btnText.innerHTML = '✅ Berhasil!';
    // Redirect otomatis dari onAuthStateChanged
  } catch (err) {
    console.error('Login error:', err);
    let msg = 'Email atau password salah!';
    if (err.code === 'auth/invalid-email') msg = 'Format email tidak valid!';
    else if (err.code === 'auth/user-not-found') msg = 'Akun tidak ditemukan!';
    else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') msg = 'Email atau password salah!';
    else if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba nanti.';
    else if (err.code === 'auth/network-request-failed') msg = 'Koneksi internet bermasalah!';
    else if (err.code === 'auth/operation-not-allowed') msg = 'Login Email/Password belum diaktifkan di Firebase!';
    
    showLoginAlert(msg, 'error');
    pwdInput.classList.add('error');
    setTimeout(() => pwdInput.classList.remove('error'), 500);
    btn.disabled = false;
    btnText.innerHTML = '🔓 Masuk';
  }
}

function showLoginAlert(msg, type) {
  const el = document.getElementById('loginAlert');
  el.textContent = (type === 'error' ? '❌ ' : '✅ ') + msg;
  el.className = 'login-alert ' + type + ' show';
}

function togglePassword() {
  const inp = document.getElementById('loginPassword');
  const btn = document.getElementById('togglePassBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

/* ============================================================
   🎨 THEME
============================================================ */
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
}

(function initTheme() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeIcon').textContent = saved === 'dark' ? '☀️' : '🌙';
})();
</script>
</body>
</html>
