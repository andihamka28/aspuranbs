// Helper: doc reference (dengan UID user sebagai namespace)
function userDoc(coll) {
  return db.collection('users').doc(currentUser.uid).collection(coll);
}
function userMeta() {

/* ============================================================
   🔐 AUTHENTICATION
============================================================ */
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('loginScreen').classList.add('hide');
    document.getElementById('app').style.display = 'flex';
    await initApp();
  } else {
    currentUser = null;
    cleanupListeners();
    document.getElementById('loginScreen').classList.remove('hide');
    document.getElementById('app').style.display = 'none';
    setTimeout(() => document.getElementById('loginEmail')?.focus(), 400);
  }
});

function cleanupListeners() {
  unsubscribeListeners.forEach(fn => { try { fn(); } catch(e) {} });
  unsubscribeListeners = [];
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const remember = document.getElementById('loginRemember').checked;
  const btn = document.getElementById('btnLogin');
  const btnText = document.getElementById('btnLoginText');
  const alertEl = document.getElementById('loginAlert');
  const pwdInput = document.getElementById('loginPassword');
  
  alertEl.classList.remove('show');
  pwdInput.classList.remove('error');
  
  if (!email || !password) {
    showLoginAlert('Email dan password wajib diisi!', 'error');
    return;
  }
  
  btn.disabled = true;
  btnText.innerHTML = '<div class="spinner"></div> Memverifikasi...';
  
  try {
    // Set persistence sesuai "remember me"
    const persistence = remember 
      ? firebase.auth.Auth.Persistence.LOCAL 
      : firebase.auth.Auth.Persistence.SESSION;
    await auth.setPersistence(persistence);
    
    await auth.signInWithEmailAndPassword(email, password);
    showLoginAlert('Login berhasil!', 'success');
    btnText.innerHTML = '✅ Berhasil!';
  } catch (err) {
    console.error(err);
    let msg = 'Email atau password salah!';
    if (err.code === 'auth/invalid-email') msg = 'Format email tidak valid!';
    else if (err.code === 'auth/user-not-found') msg = 'Akun tidak ditemukan!';
    else if (err.code === 'auth/wrong-password') msg = 'Password salah!';
    else if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
    else if (err.code === 'auth/network-request-failed') msg = 'Koneksi internet bermasalah!';
    
    showLoginAlert(msg, 'error');
    pwdInput.classList.add('error');
    setTimeout(() => pwdInput.classList.remove('error'), 500);
    btn.disabled = false;
    btnText.innerHTML = '🔓 Masuk';
  }
}

function showLoginAlert(msg, type) {
  const el = document.getElementById('loginAlert');
  el.textContent = (type === 'error' ? '❌ ' : '✅ ') + msg;
  el.className = 'login-alert ' + type + ' show';
}

async function handleLogout() {
  if (!confirm('Yakin ingin logout?')) return;
  try {
    await auth.signOut();
    showToast('Berhasil logout');
  } catch (err) {
    console.error(err);

}

function togglePassword() {
  const inp = document.getElementById('loginPassword');
  const btn = document.getElementById('togglePassBtn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁️'; }
}

/* ============================================================
   🔑 UBAH PASSWORD
============================================================ */
function openChangePassword() {
  document.getElementById('changePwdModal').style.display = 'flex';
  document.getElementById('pwdAlert').classList.remove('show');
  document.getElementById('pwdLama').value = '';
  document.getElementById('pwdBaru').value = '';
  document.getElementById('pwdKonfirmasi').value = '';
  document.getElementById('userDropdown').classList.remove('show');
}

function closeChangePassword() {
  document.getElementById('changePwdModal').style.display = 'none';
}

async function submitChangePassword() {
  const lama = document.getElementById('pwdLama').value;
  const baru = document.getElementById('pwdBaru').value;
  const konf = document.getElementById('pwdKonfirmasi').value;
  const alertEl = document.getElementById('pwdAlert');
  
  alertEl.classList.remove('show');
  
  if (!lama || !baru || !konf) {
    alertEl.textContent = '❌ Semua field wajib diisi!';
    alertEl.className = 'login-alert error show';
    return;
  }
  if (baru.length < 6) {
    alertEl.textContent = '❌ Password baru minimal 6 karakter!';
    alertEl.className = 'login-alert error show';
    return;
  }
  if (baru !== konf) {
    alertEl.textContent = '❌ Konfirmasi password tidak cocok!';
    alertEl.className = 'login-alert error show';
    return;
  }
  
  try {
    const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, lama);
    await currentUser.reauthenticateWithCredential(cred);
    await currentUser.updatePassword(baru);
    closeChangePassword();
    showToast('Password berhasil diubah!');
  } catch (err) {
    console.error(err);
    let msg = 'Gagal mengubah password!';
    if (err.code === 'auth/wrong-password') msg = 'Password lama salah!';
    else if (err.code === 'auth/weak-password') msg = 'Password baru terlalu lemah!';
    alertEl.textContent = '❌ ' + msg;
    alertEl.className = 'login-alert error show';
  }
}

async function initApp() {

  document.getElementById('ddRole').textContent = 'Administrator · ' + email;
  
  // Set listener realtime
  setupRealtimeListeners();
  
  updateClock();
}

function setupRealtimeListeners() {
  cleanupListeners();
  
  // PENGATURAN (document tunggal)
  const unsubSettings = userMeta().onSnapshot(doc => {
    if (doc.exists && doc.data().pengaturan) {
      pengaturan = doc.data().pengaturan;
    }
    loadPengaturan();
  }, err => console.error('pengaturan:', err));
  unsubscribeListeners.push(unsubSettings);
  
  // SANTRI
  const unsubSantri = userDoc('santri').onSnapshot(snap => {
    santriList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshAll();
  }, err => { console.error('santri:', err); showToast('Gagal memuat santri', 'error'); });
  unsubscribeListeners.push(unsubSantri);
  
  // TRANSAKSI
  const unsubTrx = userDoc('transaksi').onSnapshot(snap => {
    transaksiList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    refreshAll();
  }, err => { console.error('transaksi:', err); showToast('Gagal memuat transaksi', 'error'); });
  unsubscribeListeners.push(unsubTrx);
  
  // KEGIATAN
  const unsubKeg = userDoc('kegiatan').onSnapshot(snap => {
    kegiatanList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderKegiatan();
    renderDashboard();
  }, err => console.error('kegiatan:', err));
  unsubscribeListeners.push(unsubKeg);
  
  // PENGUMUMAN
  const unsubPeng = userDoc('pengumuman').onSnapshot(snap => {
    pengumumanList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderPengumuman();
    renderDashboard();
    updateBadgePengumuman();
  }, err => console.error('pengumuman:', err));
  unsubscribeListeners.push(unsubPeng);
}

async function saveSantri(data, id = null) {
  try {
    if (id) {
      await userDoc('santri').doc(id).update(data);
    } else {
      await userDoc('santri').add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    }
    return true;
  } catch (err) {
    console.error(err);
    showToast('Gagal menyimpan santri', 'error');
    return false;
  }
}

async function deleteSantri(id) {
  try {
    // Hapus santri
    await userDoc('santri').doc(id).delete();
    // Hapus semua transaksi terkait
    const trxSnap = await userDoc('transaksi').where('santriId', '==', id).get();
    const batch = db.batch();
    trxSnap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
    return true;
  } catch (err) {
    console.error(err);
    showToast('Gagal menghapus santri', 'error');
    return false;
  }
}

/* ============================================================
   💾 BACKUP & RESTORE (Firestore → JSON)
============================================================ */
async function backupData() {
  const data = {
    santriList, transaksiList, kegiatanList, pengumumanList, pengaturan,
    exportedAt: new Date().toISOString(),
    exportedBy: currentUser.email,
    version: 6
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup-bank-santri-${today()}.json`;
  a.click();
  showToast('Backup berhasil didownload');
}

async function restoreData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('Restore akan MENIMPA data di Firestore. Lanjutkan?')) return;
      
      showToast('Sedang restore...', 'info');
      
      // Hapus data lama dulu
      const collections = ['santri', 'transaksi', 'kegiatan', 'pengumuman'];
      for (const coll of collections) {
        const snap = await userDoc(coll).get();
        const batch = db.batch();
        snap.docs.forEach(d => batch.delete(d.ref));
        await batch.commit();
      }
      
      // Upload data baru (batch write)
      const uploads = [
        { coll: 'santri', items: data.santriList || [], keepId: true },
        { coll: 'transaksi', items: data.transaksiList || [], keepId: true },
        { coll: 'kegiatan', items: data.kegiatanList || [], keepId: true },
        { coll: 'pengumuman', items: data.pengumumanList || [], keepId: true }
      ];
      
      for (const { coll, items } of uploads) {
        for (const item of items) {
          const { id, ...rest } = item;
          await userDoc(coll).doc(String(id)).set(rest);
        }
      }
      
      if (data.pengaturan) {
        pengaturan = data.pengaturan;
        await savePengaturan();
      }
      
      showToast('Data berhasil dipulihkan!');
    } catch(err) {
      console.error(err);
      showToast('File tidak valid!', 'error');
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

async function hapusSemuaData() {
  if (!confirm('⚠️ SEMUA DATA AKAN DIHAPUS DARI FIRESTORE!\n\nLanjutkan?')) return;
  if (!confirm('Yakin? Tindakan ini tidak dapat dibatalkan!')) return;
  
  try {
    showToast('Menghapus data...', 'info');
    const collections = ['santri', 'transaksi', 'kegiatan', 'pengumuman'];
    for (const coll of collections) {
      const snap = await userDoc(coll).get();
      const batch = db.batch();
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
    }
    await userMeta().set({ pengaturan: {} }, { merge: false });
    showToast('Semua data telah dihapus', 'warning');
  } catch (err) {
    console.error(err);
    showToast('Gagal menghapus data', 'error');
  }
}

function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + (type !== 'success' ? type : '');
  const icons = { success:'✅', error:'❌', warning:'⚠️', info:'ℹ️' };
  t.innerHTML = `<span>${icons[type]||'✅'}</span> ${msg}`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.animation = 'slideInR .3s reverse'; setTimeout(()=>t.remove(), 300); }, 2500);
}

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  const icon = next === 'dark' ? '☀️' : '🌙';
  const t1 = document.getElementById('themeIcon');
  const t2 = document.getElementById('themeIconLogin');
  if (t1) t1.textContent = icon;
  if (t2) t2.textContent = icon;

function updateClock() {
  const now = new Date();
  const hour = now.getHours();
  let greeting = 'Assalamu\'alaikum';
  if (hour >= 4 && hour < 11) greeting = '🌅 Selamat Pagi';
  else if (hour >= 11 && hour < 15) greeting = '☀️ Selamat Siang';
  else if (hour >= 15 && hour < 18) greeting = '🌇 Selamat Sore';
  else if (hour >= 18) greeting = '🌙 Selamat Malam';
  
  const greetEl = document.getElementById('greetTime');
  if (greetEl) greetEl.textContent = greeting + ', Pemilik';
  
  const dateEl = document.getElementById('heroDate');
  if (dateEl) dateEl.textContent = now.toLocaleDateString('id-ID', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  
  const timeEl = document.getElementById('heroTime');
  if (timeEl) timeEl.textContent = now.toLocaleTimeString('id-ID', {
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}
setInterval(updateClock, 1000);

function hitungSaldo(santriId) {
  return transaksiList
    .filter(t => t.santriId == santriId)
    .reduce((sum, t) => sum + (t.jenis === 'masuk' ? t.jumlah : -t.jumlah), 0);
}

let laporanMode = 'semua';
function switchTabLaporan(mode, el) {

  el.classList.add('active');

function renderLaporan() {
  const el = document.getElementById('laporanContent');
  if (!el) return;
  
  if (laporanMode === 'semua') {
    if (santriList.length === 0) { el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><p>Belum ada data</p></div>`; return; }
    
    let tM = 0, tK = 0;
    const rows = santriList.map((s, i) => {
      const trx = transaksiList.filter(t => t.santriId == s.id);
      const masuk = trx.filter(t => t.jenis === 'masuk').reduce((a,b) => a + b.jumlah, 0);
      const keluar = trx.filter(t => t.jenis === 'keluar').reduce((a,b) => a + b.jumlah, 0);
      tM += masuk; tK += keluar;
      const saldo = masuk - keluar;
      return `<tr>
        <td>${i+1}</td>
        <td><strong>${s.nama}</strong><br><small style="color:var(--text-muted)">${s.kamar||'-'}</small></td>
        <td class="text-positif">${rupiah(masuk)}</td>
        <td class="text-negatif">${rupiah(keluar)}</td>
        <td class="${saldo>=0?'text-positif':'text-negatif'}"><strong>${rupiah(saldo)}</strong></td>
      </tr>`;
    }).join('');
    
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>No</th><th>Nama Santri</th><th>Total Setoran</th><th>Total Pengeluaran</th><th>Saldo Akhir</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr style="background:var(--bg); font-weight:700;">
          <td colspan="2">TOTAL</td>
          <td class="text-positif">${rupiah(tM)}</td>
          <td class="text-negatif">${rupiah(tK)}</td>
          <td class="${(tM-tK)>=0?'text-positif':'text-negatif'}">${rupiah(tM-tK)}</td>
        </tr>
      </tfoot>
    </table></div>`;
  } else if (laporanMode === 'bulanan') {
    const bulanan = {};
    transaksiList.forEach(t => {
      const bln = t.tanggal.substring(0,7);
      if (!bulanan[bln]) bulanan[bln] = { masuk:0, keluar:0 };
      bulanan[bln][t.jenis] += t.jumlah;
    });
    const keys = Object.keys(bulanan).sort().reverse();
    if (keys.length === 0) { el.innerHTML = `<div class="empty"><div class="empty-icon">📅</div><p>Belum ada transaksi</p></div>`; return; }
    
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Bulan</th><th>Setoran</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>
      <tbody>
        ${keys.map(k => {
          const d = bulanan[k];
          const sel = d.masuk - d.keluar;
          return `<tr>
            <td><strong>${new Date(k+'-01').toLocaleDateString('id-ID',{month:'long', year:'numeric'})}</strong></td>
            <td class="text-positif">${rupiah(d.masuk)}</td>
            <td class="text-negatif">${rupiah(d.keluar)}</td>
            <td class="${sel>=0?'text-positif':'text-negatif'}">${rupiah(sel)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table></div>`;
  } else if (laporanMode === 'kategori') {
    const kat = {};
    transaksiList.forEach(t => {
      const key = (t.jenis === 'masuk' ? '📥 ' : '📤 ') + (t.kategori || 'Lainnya');
      if (!kat[key]) kat[key] = 0;
      kat[key] += t.jumlah;
    });
    const keys = Object.keys(kat).sort();
    if (keys.length === 0) { el.innerHTML = `<div class="empty"><div class="empty-icon">🏷️</div><p>Belum ada transaksi</p></div>`; return; }
    
    el.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Kategori</th><th>Total</th></tr></thead>
      <tbody>
        ${keys.map(k => `<tr><td>${k}</td><td class="${k.startsWith('📥')?'text-positif':'text-negatif'}">${rupiah(kat[k])}</td></tr>`).join('')}
      </tbody>
    </table></div>`;
  }
}

    const label = d.toLocaleDateString('id-ID', {month:'short'});
    const masuk = transaksiList.filter(t => t.jenis === 'masuk' && t.tanggal.startsWith(key)).reduce((a,b) => a + b.jumlah, 0);
    const keluar = transaksiList.filter(t => t.jenis === 'keluar' && t.tanggal.startsWith(key)).reduce((a,b) => a + b.jumlah, 0);
    months.push({ label, masuk, keluar });
  }
  const max = Math.max(...months.map(m => Math.max(m.masuk, m.keluar)), 1);
  el.innerHTML = months.map(m => {
    const hM = (m.masuk / max) * 100;
    const hK = (m.keluar / max) * 100;
    return `<div class="bar-item">
      <div class="bar-pair">
        <div class="bar masuk" style="height:${hM}%" title="Setoran: ${rupiah(m.masuk)}"></div>
        <div class="bar keluar" style="height:${hK}%" title="Pengeluaran: ${rupiah(m.keluar)}"></div>
      </div>
      <div class="bar-label">${m.label}</div>
    </div>`;
  }).join('');
}

/* ============================================================
   🎨 RENDER DASHBOARD
============================================================ */
function getMonthTotal(jenis, year, month) {
  return transaksiList
    .filter(t => {
      const d = new Date(t.tanggal);
      return t.jenis === jenis && d.getFullYear() === year && d.getMonth() === month;
    })
    .reduce((a, b) => a + b.jumlah, 0);
}

function formatTrend(current, previous) {
  if (previous === 0) return current > 0 ? { text: 'Baru', class: 'up' } : { text: '-', class: 'neutral' };
  const pct = ((current - previous) / previous) * 100;
  if (pct > 0) return { text: '↑ ' + pct.toFixed(0) + '%', class: 'up' };
  if (pct < 0) return { text: '↓ ' + Math.abs(pct).toFixed(0) + '%', class: 'down' };
  return { text: '0%', class: 'neutral' };
}

function renderDashboard() {
  const now = new Date();
  const thisMonth = { y: now.getFullYear(), m: now.getMonth() };
  const lastMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  const lastMonth = { y: lastMonthDate.getFullYear(), m: lastMonthDate.getMonth() };
  
  const totalMasuk = transaksiList.filter(t => t.jenis === 'masuk').reduce((a,b) => a + b.jumlah, 0);
  const totalKeluar = transaksiList.filter(t => t.jenis === 'keluar').reduce((a,b) => a + b.jumlah, 0);
  const totalSaldo = totalMasuk - totalKeluar;
  
  const masukBulanIni = getMonthTotal('masuk', thisMonth.y, thisMonth.m);
  const keluarBulanIni = getMonthTotal('keluar', thisMonth.y, thisMonth.m);
  const masukBulanLalu = getMonthTotal('masuk', lastMonth.y, lastMonth.m);
  const keluarBulanLalu = getMonthTotal('keluar', lastMonth.y, lastMonth.m);
  
  const setTxt = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  setTxt('statSaldo', rupiah(totalSaldo));
  setTxt('statMasukBulan', rupiah(masukBulanIni));
  setTxt('statKeluarBulan', rupiah(keluarBulanIni));
  setTxt('statSantri', santriList.length);
  
  const tM = document.getElementById('trendMasuk');
  if (tM) { const t = formatTrend(masukBulanIni, masukBulanLalu); tM.textContent = t.text; tM.className = 'stat-trend-badge ' + t.class; }
  const tK = document.getElementById('trendKeluar');
  if (tK) { const t = formatTrend(keluarBulanIni, keluarBulanLalu); tK.textContent = t.text; tK.className = 'stat-trend-badge ' + t.class; }
  
  const tS = document.getElementById('trendSantri');
  if (tS) {
    const santriBaru = santriList.filter(s => {
      if (!s.tgl) return false;
      const d = new Date(s.tgl);
      return d.getFullYear() === thisMonth.y && d.getMonth() === thisMonth.m;
    }).length;
    tS.textContent = santriBaru > 0 ? '+' + santriBaru + ' baru' : 'bulan ini';
    tS.className = 'stat-trend-badge ' + (santriBaru > 0 ? 'up' : 'neutral');
  }
  
  // TOP 5
  const dl = document.getElementById('dashboardList');
  if (dl) {
    if (santriList.length === 0) {
      dl.innerHTML = `<div class="empty" style="padding:30px 10px;"><div class="empty-icon" style="font-size:40px;">🕌</div><p>Belum ada santri</p></div>`;
    } else {
      const sorted = [...santriList].map(s => ({...s, saldo: hitungSaldo(s.id)})).sort((a,b) => b.saldo - a.saldo).slice(0, 5);
      const medals = ['🥇','🥈','🥉','4️⃣','5️⃣'];
      dl.innerHTML = sorted.map((s, i) => {
        const jmlTrx = transaksiList.filter(t => t.santriId == s.id).length;
        return `<div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--bg); border-radius:10px; margin-bottom:8px;">
          <div style="display:flex; align-items:center; gap:12px; min-width:0; flex:1;">
            <span style="font-size:22px;">${medals[i]}</span>
            <div style="min-width:0; flex:1;">
              <strong style="display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${s.nama}</strong>
              <small style="font-size:11px; color:var(--text-muted);">${s.kamar || 'Tanpa kamar'} · ${jmlTrx} transaksi</small>
            </div>
          </div>
          <div class="${s.saldo>=0?'text-positif':'text-negatif'}" style="font-size:14px; font-weight:800; white-space:nowrap; margin-left:8px;">${rupiah(s.saldo)}</div>
        </div>`;
      }).join('');
    }
  }
  
  // INSIGHT
  const insightEl = document.getElementById('insightContent');
  if (insightEl) {
    const insights = [];
    const selisih = masukBulanIni - keluarBulanIni;
    if (masukBulanIni > 0 || keluarBulanIni > 0) {
      if (selisih > 0) insights.push({ icon:'✅', class:'good', title:'Keuangan Sehat', text:`Bulan ini surplus ${rupiah(selisih)}.` });
      else if (selisih < 0) insights.push({ icon:'⚠️', class:'warn', title:'Defisit Bulan Ini', text:`Pengeluaran melebihi pemasukan sebesar ${rupiah(Math.abs(selisih))}.` });
      else insights.push({ icon:'ℹ️', class:'', title:'Seimbang', text:'Pemasukan dan pengeluaran seimbang.' });
    } else {
      insights.push({ icon:'📊', class:'', title:'Belum Ada Transaksi', text:'Belum ada transaksi bulan ini.' });
    }
    if (masukBulanLalu > 0) {
      const diff = ((masukBulanIni - masukBulanLalu) / masukBulanLalu) * 100;
      if (diff > 10) insights.push({ icon:'📈', class:'good', title:'Pemasukan Naik', text:`Setoran naik ${diff.toFixed(0)}% dibanding bulan lalu.` });
      else if (diff < -10) insights.push({ icon:'📉', class:'warn', title:'Pemasukan Turun', text:`Setoran turun ${Math.abs(diff).toFixed(0)}%.` });
    }
    const negatifCount = santriList.filter(s => hitungSaldo(s.id) < 0).length;
    if (negatifCount > 0) insights.push({ icon:'🚨', class:'bad', title: negatifCount + ' Santri Saldo Negatif', text:`Ada ${negatifCount} santri saldo minus.` });
    if (insights.length === 0) insights.push({ icon:'💡', class:'', title:'Selamat Datang', text:'Tambahkan santri dan catat transaksi.' });
    
    insightEl.innerHTML = insights.map(i => `
      <div class="insight-item ${i.class}">
        <div class="insight-icon">${i.icon}</div>
        <div style="flex:1;"><strong>${i.title}</strong><p>${i.text}</p></div>
      </div>
    `).join('');
  }
  
  // SALDO RENDAH
  const lowEl = document.getElementById('lowBalanceList');
  if (lowEl) {
    const low = santriList.map(s => ({...s, saldo: hitungSaldo(s.id)})).filter(s => s.saldo < 50000).sort((a,b) => a.saldo - b.saldo).slice(0, 5);
    if (low.length === 0) {
      lowEl.innerHTML = `<div class="empty" style="padding:30px 10px;"><div class="empty-icon" style="font-size:40px;">✨</div><p>Semua santri saldonya aman</p></div>`;
    } else {
      lowEl.innerHTML = low.map(s => `
        <div class="low-balance-item ${s.saldo < 0 ? 'danger' : ''}">
          <div class="info"><strong>${s.nama}</strong><small>${s.kamar || 'Tanpa kamar'}</small></div>
          <div class="amount">${rupiah(s.saldo)}</div>
        </div>
      `).join('');
    }
  }
  
  // TRANSAKSI TERBARU
  const recEl = document.getElementById('recentTransactions');
  if (recEl) {
    const rec = [...transaksiList].sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)).slice(0, 5);
    if (rec.length === 0) {
      recEl.innerHTML = `<div class="empty" style="padding:30px 10px;"><div class="empty-icon" style="font-size:40px;">📭</div><p>Belum ada transaksi</p></div>`;
    } else {
      recEl.innerHTML = rec.map(t => {
        const s = santriList.find(x => x.id == t.santriId);
        const tgl = new Date(t.tanggal);
        const selisih = Math.floor((new Date() - tgl) / 86400000);
        let kapan;
        if (selisih === 0) kapan = 'Hari ini';
        else if (selisih === 1) kapan = 'Kemarin';
        else if (selisih < 7) kapan = selisih + ' hari lalu';
        else kapan = tgl.toLocaleDateString('id-ID', {day:'numeric', month:'short'});
        return `<div class="recent-item">
          <div class="recent-icon ${t.jenis}">${t.jenis === 'masuk' ? '📥' : '📤'}</div>
          <div class="recent-info">
            <strong>${s ? s.nama : '(dihapus)'} · ${t.kategori || '-'}</strong>
            <small>${t.ket || 'Tanpa keterangan'} · ${kapan}</small>
          </div>
          <div class="recent-amount ${t.jenis === 'masuk' ? 'text-positif' : 'text-negatif'}">
            ${t.jenis === 'masuk' ? '+' : '-'}${rupiah(t.jumlah)}
            <small>${t.jenis === 'masuk' ? 'masuk' : 'keluar'}</small>
          </div>
        </div>`;
      }).join('');
    }
  }
  
  // KEGIATAN
  const evEl = document.getElementById('upcomingEvents');
  if (evEl) {
    const todayStr = today();
    const up = [...kegiatanList].filter(k => k.tanggal >= todayStr).sort((a,b) => new Date(a.tanggal) - new Date(b.tanggal)).slice(0, 3);
    if (up.length === 0) {
      evEl.innerHTML = `<div class="empty" style="padding:30px 10px;"><div class="empty-icon" style="font-size:40px;">📅</div><p>Tidak ada kegiatan mendatang</p></div>`;
    } else {
      evEl.innerHTML = up.map(k => {
        const d = new Date(k.tanggal);
        return `<div class="event-item" onclick="goToPage('kegiatan')">
          <div class="event-date">
            <span class="day">${d.getDate()}</span>
            <span class="month">${d.toLocaleDateString('id-ID',{month:'short'})}</span>
          </div>
          <div class="event-info">
            <strong>${k.nama}</strong>
            <small>⏰ ${k.waktu || 'Sepanjang hari'} · 📍 ${k.lokasi || '-'}</small>
          </div>
        </div>`;
      }).join('');
    }
  }
  
  // PENGUMUMAN
  const anEl = document.getElementById('activeAnnouncements');
  if (anEl) {
    const rec = [...pengumumanList].sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal)).slice(0, 3);
    if (rec.length === 0) {
      anEl.innerHTML = `<div class="empty" style="padding:30px 10px;"><div class="empty-icon" style="font-size:40px;">📢</div><p>Belum ada pengumuman</p></div>`;
    } else {
      const icons = { info:'ℹ️', penting:'⚠️', urgent:'🚨' };
      anEl.innerHTML = rec.map(p => `
        <div class="announce-item ${p.prioritas}" onclick="goToPage('pengumuman')">
          <strong>${icons[p.prioritas]} ${p.judul}</strong>
          <p>${p.isi}</p>
          <small style="display:block;margin-top:6px;font-size:10.5px;color:var(--text-muted);">
            ${new Date(p.tanggal).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}
          </small>
        </div>
      `).join('');
    }
  }
}

/* ============================================================
   🌐 GLOBAL SEARCH
============================================================ */
function globalSearchHandler() {
  const q = document.getElementById('globalSearch').value.toLowerCase();
  if (!q) return;
  goToPage('santri');
  document.getElementById('cariSantri').value = q;
  renderSantri();
}

/* ============================================================
   🔄 REFRESH ALL
============================================================ */
function refreshAll() {
  const opts = santriList.map(s => `<option value="${s.id}">${s.nama}${s.kamar?' - '+s.kamar:''}</option>`).join('');
  ['setorSantri','keluarSantri'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = '<option value="">-- Pilih Santri --</option>' + opts;
  });
  const fS = document.getElementById('filterSantri');
  if (fS) fS.innerHTML = '<option value="">-- Semua Santri --</option>' + opts;
  
  renderSantri();
  renderTableTransaksi('setoranTable', 'masuk');
  renderTableTransaksi('pengeluaranTable', 'keluar');
  renderRiwayat();
  renderLaporan();
  renderSaldo();
  renderChart();
  renderDashboard();
  updateClock();
  updateBadgePengumuman();
  
  const setDate = (id) => { const el = document.getElementById(id); if (el && !el.value) el.value = today(); };
  ['setorTanggal','keluarTanggal','kegiatanTanggal','pengTanggal','santriTgl'].forEach(setDate);
}
